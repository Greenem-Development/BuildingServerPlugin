name: Manhunt
main: org.greenem.plugins.Manhunt.Main
version: 3.0.0
api-version: 1.18
commands:
   mhhunter:
      description: Turning the player role to the hunter
      default: true
   mhspeedrunner:
      description: Turning the player role to the speedrunner
      default: true
   mhnorole:
      description: No role (not a speedrunner or a hunter)
      default: true
   mhstart:
      description: Start mh
      default: true
   mhproblems:
      description: Special commands
      default: true
   gm:
      description: Gamemode
      permission: op
   heal:
      description: Healing
      permission: op
   loc:
      description: Show your location and direction (not that useful, but still a thing)
      default: true
   mhreloadconfig:
      description: Reload the plugin config
      permission: op
   resetworld:
      description: DELETES THE WORLD AND RESTARTS THE SERVER
      permission: op